<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #141414, #1c1c1c); /* Same background as signup */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-wrap: wrap;
        }
        .login-form {
            background-color: rgba(20, 20, 20, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(128, 0, 128, 0.4); /* Same shadow color as signup */
            width: 450px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            box-sizing: border-box; /* Ensure the padding doesn't affect the width */
        }
        .login-form h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #333;
            color: white;
            font-size: 14px;
            box-sizing: border-box; /* Ensure padding is considered in width */
        }
        .input-group input::placeholder {
            color: #bbb;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #800080; /* Purple background for button */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s ease;
            margin-top: 15px;
            box-sizing: border-box; /* Ensure padding is considered in width */
        }
        button:hover {
            background-color: #9b59b6; /* Lighter purple for hover effect */
        }
        .error-message {
            color: #dc3545; /* Red color for error */
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        .signup-link {
            text-align: center;
            margin-top: 10px;
        }
        .signup-link a {
            color: #800080; /* Purple link color */
            text-decoration: none;
            font-weight: 500;
        }
        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-form">
        <h2>Login</h2>

        <!-- Display error message if login fails -->
        {% if messages %}
            <div class="error-message">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter your username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="signup-link">
            <p>Don't have an account? <a href="{% url 'signup' %}">Signup here</a></p>
        </div>
    </div>
</body>
</html>
