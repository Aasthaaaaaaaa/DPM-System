<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #141414, #1c1c1c);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-wrap: wrap;
            height: 100vh;
        }
        .signup-form {
            background-color: rgba(20, 20, 20, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 5px 14px 15px rgba(128, 0, 128, 0.4);
            width: 450px;
            color: white;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            max-height: 80vh; /* Limit height */
            overflow-y: auto; /* Enable scrolling */
        }

        .signup-form h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-weight: 500;
            font-size: 14px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
            background-color: #333;
            color: white;
            font-size: 14px;
            box-sizing: border-box; /* Ensure padding is considered in width */
        }
        .input-group input::placeholder {
            color: #bbb;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #800080; /* Purple background */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s ease;
            box-sizing: border-box; /* Ensure padding is considered in width */
        }
        button:hover {
            background-color: #9b59b6; /* Lighter purple for hover effect */
        }
        .message, .error {
            text-align: center;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 5px;
            font-weight: 500;
        }
        .message {
            color: #28a745; /* green color */
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center; #28a745
        }
        .error {
            color: #dc3545; /* Red color for error */
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        p {
            text-align: center;
            margin-top: 10px;
        }
        a {
            color: #800080; /* Purple link color */
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        /* For Webkit-based browsers (Chrome, Edge, Safari) */
.signup-form::-webkit-scrollbar {
    width: 8px;
}

.signup-form::-webkit-scrollbar-track {
    background: #222; /* Darker background for the track */
    border-radius: 10px;
}

.signup-form::-webkit-scrollbar-thumb {
    background: #800080; /* Purple scrollbar */
    border-radius: 10px;
    transition: background 0.3s;
}

.signup-form::-webkit-scrollbar-thumb:hover {
    background: #9b59b6; /* Lighter purple on hover */
}

/* For Firefox */
.signup-form {
    scrollbar-width: thin;
    scrollbar-color: #800080 #222; /* Scrollbar thumb and track color */
}

    </style>
</head>
<body>
    <div class="signup-form">
        <h2>Signup</h2>
        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'success' %}message{% else %}error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="input-group">
                <label for="first_name">First Name</label>
                <input type="text" name="first_name" id="first_name" placeholder="Enter your first name" required>
            </div>

            <div class="input-group">
                <label for="last_name">Last Name</label>
                <input type="text" name="last_name" id="last_name" placeholder="Enter your last name" required>
            </div>

            <div class="input-group">
                <label for="profile_picture">Profile Picture</label>
                <input type="file" name="profile_picture" id="profile_picture" required>
            </div>

            <div class="input-group">
                <label for="user_type">User Type</label>
                <select name="user_type" id="user_type" required>
                    <option value="doctor">Doctor</option>
                    <option value="patient">Patient</option>
                </select>
            </div>

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Choose a username" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Create a password" required>
            </div>

            <div class="input-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm your password" required>
            </div>

            <div class="input-group">
                <label for="address_line1">Address Line 1</label>
                <input type="text" name="address_line1" id="address_line1" placeholder="Enter your address" required>
            </div>

            <div class="input-group">
                <label for="city">City</label>
                <input type="text" name="city" id="city" placeholder="Enter your city" required>
            </div>

            <div class="input-group">
                <label for="state">State</label>
                <input type="text" name="state" id="state" placeholder="Enter your state" required>
            </div>

            <div class="input-group">
                <label for="pincode">Pincode</label>
                <input type="text" name="pincode" id="pincode" placeholder="Enter your pincode" required>
            </div>

            <button type="submit">Signup</button>
        </form>
        <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</body>
</html>
