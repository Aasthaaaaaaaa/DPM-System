<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #141414, #1c1c1c); /* Dark gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-wrap: wrap;
        }
        .dashboard {
            background-color: rgba(20, 20, 20, 0.9); /* Dark background for the card */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 5px 14px 15px rgba(128, 0, 128, 0.4);
            width: 500px;
            color: white;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
        }
        .info-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
        }
        .info {
            flex: 1;
            text-align: left; /* Left-align the user details */
            font-size: 16px;
            font-weight: 100;
        }
        .info p {
            margin: 5px 0;
        }
        .profile-box {
            width: 150px;
            height: 170px;
            background-color: #333;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            object-fit: cover;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px; /* Space between the buttons */
            margin-top: 20px;
            width: 100%;
        }
        button {
            background-color: #800080; /* Signup button color */
            color: white;
            padding: 10px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s ease;
            width: 120px; /* Reduced length */
        }
        button:hover {
            background-color: #9b59b6; /* Darker purple for hover effect */
        }
        p {
            margin-top: 10px;
        }
        a {
            color: #800080; /* Purple link color */
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h2>Welcome, {{ user.first_name }} {{ user.last_name }}</h2>
        <div class="info-container">
            <div class="info">
                <p><strong>Username:</strong> {{ user.username }}</p>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Address Line 1:</strong> {{ user.address_line1 }}</p>
                <p><strong>City:</strong> {{ user.city }}</p>
                <p><strong>State:</strong> {{ user.state }}</p>
                <p><strong>Pincode:</strong> {{ user.pincode }}</p>
                <p><strong>Type:</strong> Patient</p>
            </div>
            <div class="profile-box">
                <img src="{{ user.profile_picture.url }}" alt="Profile Picture" class="profile-pic" />
            </div>
        </div>
        <div class="button-container">
            <button onclick="window.location.href='{% url 'patient_blogs' %}'">View Blogs</button>
            <button onclick="window.location.href='{% url 'logout' %}'">Logout</button>
        </div>
    </div>
</body>
</html>
