<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #141414, #1c1c1c);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            box-sizing: border-box;
            overflow-x: hidden; 
        }
        .form-container {
            background-color: rgba(20, 20, 20, 0.9);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(128, 0, 128, 0.4);
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 100%;
            margin-left: auto;
            margin-right: auto;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .input-group input,
        .input-group select,
        .input-group textarea {
            width: calc(100% - 20px); /* Ensures same width for all inputs */
            padding: 10px;
            margin: 0 10px; /* Adds uniform left and right margins */
            border-radius: 5px;
            background-color: #222; /* Dark background */
            color: #fff; /* White text */
            box-sizing: border-box;
        }
        .input-group textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 30%;
            padding: 8px;
            background-color: #800080;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #9b59b6;
        }
        .success-message {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            color: #28a745;
            font-weight: bold;
        }
        .btn-dashboard {
            width: 50%;
            padding: 6px;
            background-color: #800080;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            margin: 10px 0;
        }
        .btn-dashboard:hover {
            background-color: #9b59b6;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-left: 10px; /* Align checkbox with other fields */
        }
        .checkbox-container input {
            margin-left: 0px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- Success message at the top -->
        {% if success_message %}
            <div class="success-message">{{ success_message }}</div>
        {% endif %}
        
        <h2>Create Blog</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="input-group">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" required>
            </div>
            <div class="input-group">
                <label for="image">Image</label>
                <input type="file" name="image" id="image" accept="image/*">
            </div>
            <div class="input-group">
                <label for="category">Category</label>
                <select name="category" id="category" required>
                    <option value="Mental Health">Mental Health</option>
                    <option value="Heart Disease">Heart Disease</option>
                    <option value="Covid19">Covid19</option>
                    <option value="Immunization">Immunization</option>
                </select>
            </div>
            <div class="input-group">
                <label for="summary">Summary</label>
                <textarea name="summary" id="summary" maxlength="255" required></textarea>
            </div>
            <div class="input-group">
                <label for="content">Content</label>
                <textarea name="content" id="content" required></textarea>
            </div>
            <div class="input-group checkbox-container">
                <label for="is_draft">Save as Draft</label>
                <input type="checkbox" name="is_draft" id="is_draft">
            </div>

            <!-- Button Container -->
            <div class="button-container">
                <!-- Submit Button -->
                <button type="submit">Submit</button>
                <!-- Dashboard Button -->
                <a href="{% url 'doctor_dashboard' %}" class="btn-dashboard">Go to Dashboard</a>
            </div>
        </form>
    </div>
</body>
</html>
